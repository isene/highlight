<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
    <linearGradient id="markerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe66b"/>
      <stop offset="100%" style="stop-color:#d4a800"/>
    </linearGradient>
    <linearGradient id="markerSwipe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffe66b;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#ffe66b;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#ffe66b;stop-opacity:0.85"/>
    </linearGradient>
  </defs>

  <!-- Round badge -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>

  <!-- Three lines of "code" with tokenised colored chunks. Colors come
       directly from highlight's Monokai theme: keyword=197, string=78,
       comment=242, number=141, type=81, func=148. -->

  <!-- Line 1: keyword + type + func + ( + string + ) -->
  <g transform="translate(40, 60)">
    <rect x="0"   y="0" width="22" height="14" rx="2" fill="#ff005f"/>           <!-- keyword -->
    <rect x="28"  y="0" width="14" height="14" rx="2" fill="#5fd7ff"/>           <!-- type -->
    <rect x="46"  y="0" width="34" height="14" rx="2" fill="#afd700"/>           <!-- func -->
    <rect x="84"  y="0" width="6"  height="14" rx="2" fill="#bcbcbc"/>           <!-- punct -->
    <rect x="94"  y="0" width="60" height="14" rx="2" fill="#5fd787"/>           <!-- string -->
    <rect x="158" y="0" width="6"  height="14" rx="2" fill="#bcbcbc"/>           <!-- punct -->
  </g>

  <!-- Line 2: comment line, dimmed -->
  <g transform="translate(40, 86)">
    <rect x="0" y="0" width="160" height="14" rx="2" fill="#6c6c6c"/>            <!-- comment -->
  </g>

  <!-- Line 3: keyword + ident + = + number — this is the line being swiped -->
  <g transform="translate(40, 112)">
    <rect x="0"   y="0" width="22" height="14" rx="2" fill="#ff005f"/>           <!-- keyword -->
    <rect x="28"  y="0" width="40" height="14" rx="2" fill="#cfcfcf"/>           <!-- ident -->
    <rect x="74"  y="0" width="10" height="14" rx="2" fill="#bcbcbc"/>           <!-- punct -->
    <rect x="90"  y="0" width="30" height="14" rx="2" fill="#af87ff"/>           <!-- number -->
  </g>

  <!-- Line 4: keyword + type — slightly indented (continuation block) -->
  <g transform="translate(56, 138)">
    <rect x="0"   y="0" width="18" height="14" rx="2" fill="#ff005f"/>
    <rect x="24"  y="0" width="46" height="14" rx="2" fill="#5fd7ff"/>
    <rect x="76"  y="0" width="6"  height="14" rx="2" fill="#bcbcbc"/>
    <rect x="86"  y="0" width="50" height="14" rx="2" fill="#5fd787"/>
  </g>

  <!-- Line 5: closing brace / partial -->
  <g transform="translate(40, 164)">
    <rect x="0" y="0" width="10" height="14" rx="2" fill="#bcbcbc"/>
  </g>

  <!-- Highlighter swipe across line 3 (the number assignment), behind the marker tip -->
  <rect x="32" y="108" width="100" height="22" rx="2" fill="url(#markerSwipe)" opacity="0.55"/>

  <!-- Highlighter pen, tilted 35deg, tip touching the swipe -->
  <g transform="translate(140, 122) rotate(35)">
    <!-- Barrel: rounded rectangle, yellow body -->
    <rect x="0" y="-9" width="74" height="18" rx="3" fill="url(#markerBody)" stroke="#7a5e00" stroke-width="1.2"/>
    <!-- Cap (right end): darker amber -->
    <rect x="64" y="-9" width="10" height="18" rx="2" fill="#7a5e00"/>
    <!-- Tip (left end): chisel cut + ink point -->
    <polygon points="0,-9 -16,-3 -16,3 0,9" fill="#3a2a00"/>
    <polygon points="-16,-3 -22,0 -16,3" fill="#1a1300"/>
    <!-- Subtle highlight stripe on barrel for shape -->
    <rect x="6" y="-7" width="56" height="3" rx="1" fill="#fff3a8" opacity="0.6"/>
  </g>

  <!-- Suite identity badge bottom-left, mimicking scribe's NORMAL tag -->
  <rect x="38" y="190" width="80" height="20" rx="2" fill="#f74c00"/>
  <text x="42" y="205" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">highlight</text>
</svg>
